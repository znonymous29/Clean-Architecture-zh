name: CI

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: write
# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # lastUpdated 需要完整 git 历史读取提交时间
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install and Build
        run: |
          npm ci
          npm run docs:build
      - name: Deploy (main)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: doc_build
          clean-exclude: pr-preview  # 保留 PR 预览目录，避免主站部署时被清空
