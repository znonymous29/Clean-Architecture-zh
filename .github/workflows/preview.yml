name: PR Preview

on:
  pull_request:

permissions:
  contents: write  # upload gh-pages
  pull-requests: write  # create pr comment

concurrency:
  group: 'preview-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # lastUpdated 需要完整 git 历史读取提交时间
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install and Build
        env: 
          BASE_URL: "/Clean-Architecture-zh/pr-preview/pr-${{ github.event.pull_request.number }}/"
        run: |
          npm ci
          npm run docs:build -- --base $BASE_URL
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: doc_build
